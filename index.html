<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arch-Material & Space Archive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-white text-zinc-900 h-screen flex flex-col overflow-hidden">

    <!-- Global Navigation Bar -->
    <header class="h-16 border-b border-zinc-200 bg-white/90 backdrop-blur-md px-8 flex items-center justify-between z-50 shrink-0">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchPage('home')">
            <span class="w-3 h-3 rounded-full bg-zinc-900"></span>
            <span class="font-bold tracking-tight text-zinc-900">ARCHIVE & SPACE</span>
        </div>
        <nav class="flex items-center gap-1 sm:gap-6 text-sm font-medium text-zinc-600">
            <button onclick="switchPage('home')" id="nav-home" class="nav-btn px-3 py-1.5 rounded-lg text-zinc-900 font-semibold transition">Home</button>
            <button onclick="switchPage('material')" id="nav-material" class="nav-btn px-3 py-1.5 rounded-lg hover:text-zinc-900 transition">Material</button>
            <button onclick="switchPage('mapping')" id="nav-mapping" class="nav-btn px-3 py-1.5 rounded-lg hover:text-zinc-900 transition">3D Mapping</button>
            <button onclick="switchPage('exhibition')" id="nav-exhibition" class="nav-btn px-3 py-1.5 rounded-lg hover:text-zinc-900 transition">Exhibition</button>
            <button onclick="switchPage('interior')" id="nav-interior" class="nav-btn px-3 py-1.5 rounded-lg hover:text-zinc-900 transition">Interior</button>
        </nav>
        <div></div>
    </header>

    <!-- Main View Container (Pages) -->
    <main class="flex-1 relative overflow-hidden bg-white">

        <!-- 1. HOME PAGE -->
        <section id="page-home" class="page absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-white z-20">
            <div class="max-w-2xl space-y-6">
                <span class="inline-block px-3 py-1 rounded-full bg-zinc-100 text-zinc-600 text-xs font-semibold uppercase tracking-wider">Architectural Design Archive</span>
                <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-zinc-900">공간과 재질을 기록하고,<br>시뮬레이션하다.</h1>
                <p class="text-zinc-500 text-sm sm:text-base leading-relaxed">
                    재질 라이브러리 탐색부터 3D 공간 매핑, 커스텀 인테리어와 전시 아카이빙까지 당신만의 디자인 워크플로우를 경험하세요.
                </p>
                <div class="pt-4 flex items-center justify-center gap-4">
                    <button onclick="switchPage('mapping')" class="px-6 py-3 bg-zinc-900 text-white text-sm font-semibold rounded-xl hover:bg-zinc-800 transition shadow-lg shadow-zinc-900/10">3D 매핑 시작하기</button>
                    <button onclick="switchPage('material')" class="px-6 py-3 bg-zinc-100 text-zinc-900 text-sm font-semibold rounded-xl hover:bg-zinc-200 transition">재질 라이브러리 보기</button>
                </div>
            </div>
        </section>

        <!-- 2. MATERIAL PAGE -->
        <section id="page-material" class="page absolute inset-0 hidden flex-col overflow-y-auto p-10 z-20 bg-white">
            <div id="material-list-view" class="max-w-7xl mx-auto w-full space-y-10">
                <div class="border-b border-zinc-200 pb-6">
                    <h2 class="text-2xl font-bold tracking-tight text-zinc-900 uppercase tracking-widest">Material Spec Book</h2>
                    <p class="text-xs text-zinc-400 mt-1 uppercase tracking-wider">Architectural & Interior Finish Samples</p>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-x-6 gap-y-10" id="material-card-grid"></div>
            </div>

            <div id="material-detail-view" class="max-w-6xl mx-auto w-full space-y-8 hidden">
                <button onclick="closeMaterialDetail()" class="text-xs font-semibold text-zinc-500 hover:text-zinc-900 flex items-center gap-1 bg-zinc-50 px-3 py-1.5 rounded-lg border border-zinc-200 w-max shadow-sm">
                    ← 목록으로 돌아가기
                </button>
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1 space-y-6 bg-zinc-50 p-6 rounded-2xl border border-zinc-200 shadow-sm">
                        <div>
                            <span id="detail-category" class="text-xs font-bold text-amber-600 uppercase tracking-wider">Concrete</span>
                            <h3 id="detail-title" class="text-2xl font-bold text-zinc-900 mt-1">노출 콘크리트</h3>
                        </div>
                        <div class="space-y-4 text-sm text-zinc-600">
                            <div>
                                <h4 class="font-semibold text-zinc-900 text-xs uppercase tracking-wider mb-1">재질 특징</h4>
                                <p id="detail-desc" class="leading-relaxed"></p>
                            </div>
                            <div>
                                <h4 class="font-semibold text-zinc-900 text-xs uppercase tracking-wider mb-1">추천 적용 범위</h4>
                                <p id="detail-range" class="leading-relaxed"></p>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-2 bg-zinc-950 rounded-2xl relative h-[450px] overflow-hidden shadow-inner flex flex-col">
                        <div class="absolute top-4 left-4 z-10 bg-zinc-900/80 backdrop-blur-md px-3 py-1.5 rounded-lg border border-zinc-800 text-xs text-zinc-300">
                            <span>💡 마우스 드래그로 회전 가능</span>
                        </div>
                        <div class="absolute top-4 right-4 z-10">
                            <button onclick="toggleMaterialEnv()" id="mat-env-btn" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-zinc-800 text-zinc-200 hover:bg-zinc-700 transition shadow">
                                ☀️ 주간 채광
                            </button>
                        </div>
                        
                        <div class="absolute bottom-4 right-4 z-10 flex items-center gap-2 bg-zinc-900/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-zinc-800 shadow-lg">
                            <span class="text-[11px] font-semibold text-zinc-400">PBR 렌더</span>
                            <button onclick="toggleGlobalPBR()" id="global-pbr-btn" class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-amber-500 text-zinc-950 transition shadow-inner">
                                ON (PBR 렌더)
                            </button>
                        </div>

                        <div id="material-canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. 3D MAPPING PAGE -->
        <section id="page-mapping" class="page absolute inset-0 hidden flex z-20 bg-zinc-50">
            <aside class="w-80 bg-white border-r border-zinc-200 flex flex-col z-10 shadow-sm">
                <div class="p-6 border-b border-zinc-200">
                    <h2 class="text-lg font-bold text-zinc-900">3D Space Mapping</h2>
                    <p class="text-xs text-zinc-500 mt
